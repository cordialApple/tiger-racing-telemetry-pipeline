name: tests

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests that need no database
        run: python -m pytest -q -m "not db"
      - name: Data checks
        run: python main.py check

  db:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:2.27.1-pg16
        env:
          POSTGRES_USER: fsae
          POSTGRES_PASSWORD: fsae2023
          POSTGRES_DB: telemetry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsae -d telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: fsae
      PGPASSWORD: fsae2023
      PGDATABASE: telemetry

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Verify TimescaleDB is reachable
        run: |
          python - <<'PY'
          from db.connection import Database
          with Database().connection() as conn:
              row = conn.execute(
                  "SELECT 1 FROM pg_available_extensions WHERE name = 'timescaledb'"
              ).fetchone()
          assert row, "timescaledb extension unavailable, db tests would silently skip"
          PY

      - name: Full suite against TimescaleDB
        run: python -m pytest -q
