[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: requires a live TimescaleDB, skipped when one is not reachable",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
